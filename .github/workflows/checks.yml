# Pull-request checks. Same work as the deploy build, publishing nothing.
name: Checks

on:
  pull_request:
  # Also after every push to main, beside the deploy (which no longer
  # waits for the browser journeys), so a regression still shows up.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      VITE_BASE: ${{ vars.BASE_PATH || format('/{0}/', github.event.repository.name) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: |
          npx playwright install --with-deps chromium
          npm run test:browser
        env:
          BASE_PATH: ${{ env.VITE_BASE }}
      # The page-level collection audit: opt-in because it is slow, so it
      # runs on pull requests only.
      - if: github.event_name == 'pull_request'
        run: npm run test:audit
        env:
          BASE_PATH: ${{ env.VITE_BASE }}
