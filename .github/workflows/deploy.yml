# Publishes BotGineer to GitHub Pages.
#
# The base path is derived from the repository name, so this works unchanged
# for a project site at https://OWNER.github.io/REPOSITORY/. For a user or
# organisation site, set the repository variable BASE_PATH to "/".
#
# Nothing here invents an owner or repository: both come from the repository
# this workflow runs in.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and in-progress deployments finish, so a
# half-published site is never left behind.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_BASE: ${{ vars.BASE_PATH || format('/{0}/', github.event.repository.name) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Semantic tests (real CPython via Pyodide)
        run: npm run test

      - name: Build
        run: npm run build

      - name: Browser journeys against the production build
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
        env:
          BASE_PATH: ${{ env.VITE_BASE }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          # Dotfiles have been left out since v4; the site ships
          # `.nojekyll` on purpose (CLAUDE.md, invariant 1).
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      - name: Smoke test the published site
        # A green deploy must mean the site actually serves: the page, the
        # isolation shim, the Python runtime and the engine wheel.
        run: |
          set -euo pipefail
          url="${{ steps.deployment.outputs.page_url }}"
          echo "Checking $url"
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "$url" > /dev/null
          curl -fsS "${url}coi-serviceworker.js" > /dev/null
          curl -fsS "${url}.nojekyll" > /dev/null
          curl -fsS "${url}runtime/runtime-version.json" > /dev/null
          curl -fsS "${url}runtime/pytrace/dist/pytrace_engine-0.1.0-py3-none-any.whl" > /dev/null
          curl -fsS -o /dev/null -w '%{content_type}\n' \
            "${url}runtime/pyodide/pyodide.asm.wasm" | grep -q 'application/wasm'
          echo "Page, isolation shim and runtime assets all serve correctly."
